services:
  # ──────────────────────────────────────────────────────
  # Ingestion Service (run-once via profile)
  # Usage: docker compose --profile ingest up ingestion
  # Fetches weather data from Open-Meteo API → DuckDB/BigQuery
  # ──────────────────────────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    container_name: weather-ingestion
    profiles:
      - ingest
    volumes:
      - ./ingestion:/app/ingestion
      - ./data:/data
    environment:
      - DUCKDB_PATH=/data/capstone.duckdb
      - START_DATE=${START_DATE:-2020-01-01}
      - END_DATE=${END_DATE:-2025-12-31}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - weather-network

  # ──────────────────────────────────────────────────────
  # PostgreSQL - Backend for Kestra
  # ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: weather-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather-network

  # ──────────────────────────────────────────────────────
  # Kestra - Workflow Orchestration
  # UI available at http://localhost:8080
  # ──────────────────────────────────────────────────────
  kestra:
    image: kestra/kestra:latest
    container_name: weather-kestra
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - /app/kestra server standalone --worker-thread 1
    ports:
      - "${KESTRA_PORT:-8080}:8080"
    volumes:
      - ./kestra/flows:/opt/kestra/flows
      - ./data:/data
      - kestra-storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - weather-network

  # ──────────────────────────────────────────────────────
  # dbt - Transformation (run-once via profile)
  # Usage: docker compose --profile transform run dbt dbt run ...
  # ──────────────────────────────────────────────────────
  dbt:
    build:
      context: .
      dockerfile: docker/Dockerfile.dbt
    container_name: weather-dbt
    profiles:
      - transform
    volumes:
      - ./dbt:/app/dbt
      - ./data:/data
    environment:
      - DUCKDB_PATH=/data/capstone.duckdb
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
    networks:
      - weather-network

  # ──────────────────────────────────────────────────────
  # Dashboard - Streamlit
  # Available at http://localhost:8501
  # ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: weather-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./data:/data
    environment:
      - DUCKDB_PATH=/data/capstone.duckdb
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
    networks:
      - weather-network

networks:
  weather-network:
    driver: bridge

volumes:
  kestra-storage:
  pg-data:
