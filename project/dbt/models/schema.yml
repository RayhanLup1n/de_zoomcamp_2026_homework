version: 2

sources:
  - name: raw
    description: "Raw data from dlt ingestion (Open-Meteo Historical Weather API)"
    schema: raw
    tables:
      - name: daily_weather
        description: "Daily weather observations for 5 Indonesian cities loaded by dlt"

models:
  - name: stg_daily_weather
    description: "Staging: cleaned, standardized daily weather observations with computed fields"
    config:
      materialized: table
    tags: ['staging']
    columns:
      - name: weather_id
        description: "Unique weather observation ID (city_name-date)"
        tests:
          - unique
          - not_null
      - name: city_name
        description: "Indonesian city name"
        tests:
          - not_null
          - accepted_values:
              values: ['Jakarta', 'Surabaya', 'Denpasar', 'Medan', 'Makassar']
      - name: observation_date
        description: "Date of weather observation"
        tests:
          - not_null
      - name: temperature_mean_c
        description: "Daily mean temperature (Celsius)"
        tests:
          - not_null
      - name: weather_category
        description: "Simplified weather category based on WMO code"
        tests:
          - accepted_values:
              values: ['Clear', 'Cloudy', 'Fog', 'Drizzle', 'Rain', 'Rain Showers', 'Thunderstorm', 'Unknown']

  - name: fct_weather
    description: >
      Fact table: all daily weather observations across Indonesian cities.
      Partitioned by observation_date (monthly) and clustered by city_name in BigQuery.
    config:
      materialized: table
    tags: ['core', 'mart']
    columns:
      - name: weather_id
        description: "Unique weather observation ID"
        tests:
          - unique
          - not_null
      - name: city_name
        description: "Indonesian city name"
        tests:
          - not_null
      - name: observation_date
        description: "Date of weather observation"
        tests:
          - not_null
      - name: temperature_mean_c
        description: "Daily mean temperature (Celsius)"
      - name: precipitation_mm
        description: "Daily total precipitation (mm)"
      - name: wind_speed_max_kmh
        description: "Daily maximum wind speed (km/h)"
      - name: sunshine_hours
        description: "Daily sunshine duration (hours)"
      - name: weather_category
        description: "Simplified weather category"
        tests:
          - accepted_values:
              values: ['Clear', 'Cloudy', 'Fog', 'Drizzle', 'Rain', 'Rain Showers', 'Thunderstorm', 'Unknown']
      - name: is_rainy_day
        description: "Boolean flag: true if precipitation > 0.1mm"

  - name: weather_by_city
    description: "Analytics: weather metrics aggregated by city and year (Dashboard Tile 1)"
    config:
      materialized: table
    tags: ['analytics', 'mart']
    columns:
      - name: city_name
        description: "City name"
        tests:
          - not_null
      - name: observation_year
        description: "Year of observations"
        tests:
          - not_null
      - name: total_observations
        description: "Number of daily observations in the year"
        tests:
          - not_null

  - name: weather_monthly_trends
    description: "Analytics: monthly weather trends across all cities (Dashboard Tile 2)"
    config:
      materialized: table
    tags: ['analytics', 'mart']
    columns:
      - name: city_name
        description: "City name"
        tests:
          - not_null
      - name: observation_month
        description: "Month (1-12)"
        tests:
          - not_null
      - name: days_in_period
        description: "Number of days in the month"
        tests:
          - not_null
