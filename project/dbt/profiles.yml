indonesia_weather_analytics:
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/capstone.duckdb') }}"
      schema: analytics
      extensions:
        - parquet

    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', '') }}"
      dataset: analytics
      threads: 4
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      location: US
  target: dev
