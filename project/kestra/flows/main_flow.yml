id: indonesia_weather_pipeline
namespace: de_zoomcamp
description: >
  Indonesia Weather Analytics Pipeline.
  End-to-end DAG: Fetch weather data from Open-Meteo API,
  load into DuckDB, transform with dbt, validate with tests.

labels:
  project: "de-zoomcamp-capstone"
  environment: "local"

variables:
  duckdb_path: "/data/capstone.duckdb"
  start_date: "2020-01-01"
  end_date: "2025-12-31"

tasks:
  # ── Step 1: Validate Environment ──
  - id: validate_environment
    type: io.kestra.plugin.scripts.shell.Commands
    description: Check prerequisites and create data directory
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: alpine:3.19
    commands:
      - echo "=== Validating Environment ==="
      - mkdir -p /data
      - echo "✓ Data directory ready"
      - echo "=== Environment validated ==="

  # ── Step 2: Fetch Weather Data from Open-Meteo API ──
  - id: fetch_weather_data
    type: io.kestra.plugin.scripts.python.Commands
    description: Fetch daily weather data for 5 Indonesian cities from Open-Meteo API
    dependsOn:
      - validate_environment
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: python:3.11-slim
      volumes:
        - "/data:/data"
    beforeCommands:
      - pip install dlt[duckdb] requests --quiet --no-cache-dir
    commands:
      - python -c "{{ read('fetch_script.py') }}"
    inputFiles:
      fetch_script.py: |
        import dlt
        import requests
        import logging
        import os

        logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
        logger = logging.getLogger(__name__)

        CITIES = {
            "Jakarta": {"latitude": -6.21, "longitude": 106.85},
            "Surabaya": {"latitude": -7.25, "longitude": 112.75},
            "Denpasar": {"latitude": -8.65, "longitude": 115.22},
            "Medan": {"latitude": 3.59, "longitude": 98.67},
            "Makassar": {"latitude": -5.14, "longitude": 119.42},
        }

        OPEN_METEO_URL = "https://archive-api.open-meteo.com/v1/archive"
        DAILY_VARS = "temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,rain_sum,windspeed_10m_max,sunshine_duration,weathercode"

        @dlt.resource(name="daily_weather", write_disposition="replace")
        def daily_weather():
            for city, coords in CITIES.items():
                logger.info(f"Fetching {city}...")
                resp = requests.get(OPEN_METEO_URL, params={
                    "latitude": coords["latitude"],
                    "longitude": coords["longitude"],
                    "start_date": os.getenv("START_DATE", "2020-01-01"),
                    "end_date": os.getenv("END_DATE", "2025-12-31"),
                    "daily": DAILY_VARS,
                    "timezone": "Asia/Jakarta",
                }, timeout=120)
                resp.raise_for_status()
                daily = resp.json()["daily"]
                for i, date in enumerate(daily["time"]):
                    yield {
                        "city_name": city,
                        "latitude": coords["latitude"],
                        "longitude": coords["longitude"],
                        "observation_date": date,
                        "temperature_2m_max": daily["temperature_2m_max"][i],
                        "temperature_2m_min": daily["temperature_2m_min"][i],
                        "temperature_2m_mean": daily["temperature_2m_mean"][i],
                        "precipitation_sum": daily["precipitation_sum"][i],
                        "rain_sum": daily["rain_sum"][i],
                        "windspeed_10m_max": daily["windspeed_10m_max"][i],
                        "sunshine_duration": daily["sunshine_duration"][i],
                        "weather_code": daily["weathercode"][i],
                    }
                logger.info(f"  ✓ {city} complete")

        pipeline = dlt.pipeline(
            pipeline_name="indonesia_weather",
            destination=dlt.destinations.duckdb(credentials="/data/capstone.duckdb"),
            dataset_name="raw",
        )
        load_info = pipeline.run(daily_weather())
        logger.info("=== Ingestion complete! ===")
        print(load_info)
    env:
      START_DATE: "{{ vars.start_date }}"
      END_DATE: "{{ vars.end_date }}"

  # ── Step 3: Run dbt Transformations ──
  - id: dbt_transform
    type: io.kestra.plugin.scripts.python.Commands
    description: Run dbt models (staging → core → analytics)
    dependsOn:
      - fetch_weather_data
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: python:3.11-slim
      volumes:
        - "/data:/data"
    beforeCommands:
      - pip install dbt-core dbt-duckdb --quiet --no-cache-dir
    commands:
      - cd /app/dbt && dbt run --profiles-dir . --project-dir .
    env:
      DUCKDB_PATH: "{{ vars.duckdb_path }}"

  # ── Step 4: Run dbt Tests ──
  - id: dbt_test
    type: io.kestra.plugin.scripts.python.Commands
    description: Run dbt tests to validate data quality
    dependsOn:
      - dbt_transform
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: python:3.11-slim
      volumes:
        - "/data:/data"
    beforeCommands:
      - pip install dbt-core dbt-duckdb --quiet --no-cache-dir
    commands:
      - cd /app/dbt && dbt test --profiles-dir . --project-dir .
    env:
      DUCKDB_PATH: "{{ vars.duckdb_path }}"

  # ── Step 5: Pipeline Complete ──
  - id: pipeline_complete
    type: io.kestra.core.tasks.log.Log
    dependsOn:
      - dbt_test
    description: Pipeline completed successfully
    message: >
      ✅ Indonesia Weather Analytics Pipeline completed successfully!
      Data: 5 Indonesian cities (2020-2025)
      Layers: raw → staging → core → analytics
      Dashboard: http://localhost:8501

triggers:
  - id: daily_schedule
    type: io.kestra.core.models.triggers.types.Schedule
    cron: "0 6 * * *"
    description: Daily refresh at 6 AM Jakarta time (disabled by default)
    disabled: true
